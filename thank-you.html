<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | BuiltByJosiah</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #071426;
            color: white;
        }

        .thank-you {
            width: 100%;
            max-width: 600px;
            padding: 50px 30px;
            text-align: center;
            background: #10243d;
            border: 1px solid #244568;
            border-radius: 18px;
        }

        .check {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #123f48;
            color: #42d6b2;
            font-size: 40px;
        }

        h1 {
            margin-bottom: 18px;
            font-size: 32px;
        }

        p {
            margin-bottom: 15px;
            color: #c2cede;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            border-radius: 8px;
            background: #2585ee;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #126bc9;
        }

        .brand {
            margin-top: 30px;
            color: #8ca6c3;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="thank-you">
        <div class="check">✓</div>

        <h1>Thank You!</h1>

        <p>Your enquiry has been submitted successfully.</p>

        <p>
            Thank you for considering BuiltByJosiah.
            I appreciate your interest and will get back to you
            as soon as possible.
        </p>

        <a href="index.html">Return to Homepage</a>

        <div class="brand">BuiltByJosiah | Turning Ideas Into Digital Experiences</div>
    </main>

</body>

</html>
